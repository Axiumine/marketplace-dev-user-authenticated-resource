# Project-specific Semgrep rules for marketplace-dev-user-authenticated-resource.
#
# Registry packs (p/typescript, p/javascript, p/nodejs, p/secrets) are passed
# on the command line by the `semgrep` / `semgrep:ci` yarn scripts. This file
# holds only rules specific to the Marketplace platform's own conventions.
#
# Note: the sinks below are restricted to console / logger / log receivers on
# purpose — matching any `x.y(...)` call gives false positives (e.g. this
# service's own `redisClient.hGetAll(\`${process.env.REDIS_KEY}${accessToken}\`)`
# call in src/lib/db/authorizationAuthenticatedResourceHandler.mts, whose
# argument variable is named `accessToken` but which is a Redis lookup, not a
# log line).
rules:
  # Opaque access/refresh tokens live in Redis sessions and signed cookies.
  # Logging them defeats the whole point of opaque tokens.
  - id: marketplace-no-log-auth-token
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Possible logging of an access/refresh token. Auth tokens must not be written to logs (see CLAUDE.md — opaque tokens + Redis sessions).
    metadata:
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $ARG, ...)
          - patterns:
              - pattern: $L.$M(..., $ARG, ...)
              - metavariable-regex:
                  metavariable: $L
                  regex: (?i)^(logger|log)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i)(accesstoken|access_token|refreshtoken|refresh_token|bearer)

  # No marketplace-no-log-reset-secret rule here: that rule guards the password-reset
  # flow, which lives only in marketplace-dev-public-authorization (the one tier
  # reachable unauthenticated). This service has no resetPwd/resetHash/
  # resetDateReq code (grepped src/ to confirm), so the rule would have nothing
  # to match and would just be dead config.
